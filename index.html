<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlusOne Legal</title>
<style>
:root {
    --bg: #fafaf8;
    --text: #1a1a1a;
    --text-secondary: #555;
    --accent: #2255aa;
    --border: #e0e0dc;
    --card: #ffffff;
    --warn-bg: #fff3cd;
    --warn-text: #7a0000;
    --warn-border: #d9a300;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #16171a;
        --text: #e8e8e6;
        --text-secondary: #a8a8a4;
        --accent: #6fa8f0;
        --border: #2e2f33;
        --card: #1e1f23;
        --warn-bg: #3a2a00;
        --warn-text: #ffcf6b;
        --warn-border: #b8860b;
    }
}
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.6;
}
.page {
    max-width: 680px;
    margin: 0 auto;
    padding: 32px 20px 80px;
}
nav.top {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 20px 0;
    font-size: 15px;
}
nav.top a {
    color: var(--accent);
    text-decoration: none;
    margin-right: 18px;
}
nav.top a:hover { text-decoration: underline; }
h1 {
    font-size: 28px;
    margin: 8px 0 4px;
    line-height: 1.25;
}
h2 {
    font-size: 19px;
    margin: 36px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
}
p { margin: 12px 0; font-size: 16px; }
p:first-of-type { color: var(--text-secondary); font-size: 15px; }
ul { padding-left: 22px; }
li { margin: 8px 0; font-size: 16px; }
a { color: var(--accent); }
strong { font-weight: 650; }
.updated {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 28px;
}
.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 28px 8px;
}
.tofill {
    background: var(--warn-bg);
    color: var(--warn-text);
    border: 2px solid var(--warn-border);
    border-radius: 4px;
    padding: 1px 6px;
    font-weight: 700;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.92em;
}
footer.site {
    max-width: 680px;
    margin: 40px auto 0;
    padding: 20px 20px 0;
    border-top: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
}
.index-links {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 24px;
}
.index-links a {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--text);
    font-size: 17px;
    font-weight: 600;
}
.index-links a:hover { border-color: var(--accent); }
.index-links span {
    display: block;
    font-weight: 400;
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 4px;
}
</style>
</head>
<body>
<div class="page">
<h1>PlusOne</h1>
<p>Legal documents for the PlusOne app.</p>
<div class="index-links">
<a href="privacy.html">Privacy Policy<span>What PlusOne stores, and what it doesn't.</span></a>
<a href="terms.html">Terms of Use<span>What using PlusOne means, plainly.</span></a>
</div>
</div>
<footer class="site">PlusOne is developed by Ben Purser, an individual developer, not a company.</footer>
</body>
</html>
